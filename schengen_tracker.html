<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schengen Day Tracker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0d0f1a;
  color: #e0e0e0;
  min-height: 100vh;
}

/* ── HEADER ── */
.sticky-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #131621;
  border-bottom: 1px solid #222540;
  padding: 14px 28px;
}

.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 28px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 140px;
}

.brand-title {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.3px;
}

.brand-sub {
  font-size: 10px;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.counter-block {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.counter-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.count-num {
  font-size: 38px;
  font-weight: 800;
  line-height: 1;
  transition: color 0.3s;
}

.count-denom {
  font-size: 20px;
  color: #555;
  font-weight: 500;
}

.count-label {
  font-size: 10px;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

.badge {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  transition: background 0.3s, color 0.3s;
}

.progress-block {
  flex: 1;
  min-width: 180px;
}

.progress-bg {
  height: 10px;
  background: #1e2235;
  border-radius: 5px;
  overflow: hidden;
  margin-bottom: 5px;
}

.progress-fill {
  height: 100%;
  border-radius: 5px;
  transition: width 0.4s ease, background 0.3s;
}

.progress-labels {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: #444;
}

.window-block {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 200px;
}

.window-label {
  font-size: 10px;
  color: #444;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

.window-dates {
  font-size: 12px;
  color: #888;
}

.legend {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #666;
  cursor: default;
}

.legend-swatch {
  width: 14px;
  height: 14px;
  border-radius: 3px;
  flex-shrink: 0;
}

/* color states */
.safe   { color: #4ade80; }
.warn   { color: #fb923c; }
.danger { color: #f87171; }

.bg-safe   { background: #4ade80; }
.bg-warn   { background: #fb923c; }
.bg-danger { background: #f87171; }

.badge-safe   { background: rgba(74,222,128,0.12); color: #4ade80; }
.badge-warn   { background: rgba(251,146,60,0.12);  color: #fb923c; }
.badge-danger { background: rgba(248,113,113,0.12); color: #f87171; }

/* ── CALENDAR ── */
.calendar-wrapper {
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px 28px;
}

.year-section {
  margin-bottom: 36px;
}

.year-label {
  font-size: 11px;
  font-weight: 700;
  color: #333;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid #1a1d2e;
}

.months-row {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
}

.month-card {
  background: #161929;
  border-radius: 10px;
  padding: 12px 10px 10px;
  border: 1px solid #1e2235;
  width: 192px;
}

.month-title {
  font-size: 12px;
  font-weight: 600;
  color: #bbb;
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: 0.2px;
}

.dow-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: 3px;
}

.dow-cell {
  font-size: 8px;
  color: #383c55;
  text-align: center;
  padding: 1px 0;
}

.days-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}

.day {
  aspect-ratio: 1;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 8.5px;
  font-weight: 500;
  cursor: pointer;
  transition: transform 0.08s, opacity 0.1s;
  user-select: none;
  position: relative;
}

.day:hover { transform: scale(1.2); z-index: 10; }
.day.empty { background: transparent !important; cursor: default; pointer-events: none; }

.day.schengen         { background: #4ade80; color: #071a0d; }
.day.outside          { background: #1c1f36; color: #2e3356; }
.day.future-schengen  { background: rgba(74,222,128,0.22); color: rgba(74,222,128,0.65); }
.day.future-outside   { background: #141626; color: #23273d; }

.day.today {
  outline: 2px solid #818cf8;
  outline-offset: 1px;
  z-index: 5;
}

/* Highlight in-window days with subtle ring */
.day.in-window.outside { background: #1e2240; color: #353b60; }

.month-footer {
  display: flex;
  justify-content: flex-end;
  margin-top: 6px;
  min-height: 14px;
}

.month-count {
  font-size: 10px;
  font-weight: 600;
  color: #4ade80;
}

/* Tooltip */
.tooltip {
  position: fixed;
  background: #0d0f1a;
  border: 1px solid #2d3154;
  color: #ccc;
  font-size: 11px;
  padding: 5px 10px;
  border-radius: 6px;
  pointer-events: none;
  z-index: 9999;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.1s;
}

/* ── PROJECTION BAR ── */
.proj-bar {
  background: #111425;
  border-top: 1px solid #252840;
  padding: 10px 28px;
}

.proj-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

.proj-label {
  font-size: 10px;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.proj-date {
  font-size: 14px;
  font-weight: 700;
  color: #fbbf24;
}

.proj-count-group {
  display: flex;
  align-items: baseline;
  gap: 4px;
}

.proj-count {
  font-size: 22px;
  font-weight: 800;
  line-height: 1;
}

.proj-denom {
  font-size: 14px;
  color: #555;
}

.proj-badge {
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
}

.proj-window-text {
  font-size: 11px;
  color: #555;
  flex: 1;
}

.proj-hint {
  font-size: 10px;
  color: #333;
  font-style: italic;
}

.proj-close {
  background: none;
  border: 1px solid #2d3154;
  color: #555;
  border-radius: 4px;
  width: 22px;
  height: 22px;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-left: auto;
  transition: color 0.15s, border-color 0.15s;
}
.proj-close:hover { color: #aaa; border-color: #555; }

/* Selected day ring */
.day.selected {
  outline: 2px solid #fbbf24;
  outline-offset: 2px;
  z-index: 6;
}
</style>
</head>
<body>

<div class="sticky-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-title">🇪🇺 Schengen Tracker</div>
      <div class="brand-sub">90/180 rolling rule</div>
    </div>

    <div class="counter-block">
      <div class="counter-row">
        <div class="count-num safe" id="count-num">—</div>
        <div class="count-denom">/ 90</div>
        <div style="margin-left:10px">
          <div class="badge badge-safe" id="badge">— left</div>
        </div>
      </div>
      <div class="count-label">days used in 180-day window</div>
    </div>

    <div class="progress-block">
      <div class="progress-bg">
        <div class="progress-fill bg-safe" id="progress" style="width:0%"></div>
      </div>
      <div class="progress-labels">
        <span>0</span>
        <span id="progress-text">0 / 90</span>
        <span>90</span>
      </div>
    </div>

    <div class="window-block">
      <div class="window-label">Rolling window</div>
      <div class="window-dates" id="window-dates">…</div>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-swatch" style="background:#4ade80"></div>
        In Schengen
      </div>
      <div class="legend-item">
        <div class="legend-swatch" style="background:#1c1f36"></div>
        Outside Schengen
      </div>
      <div class="legend-item">
        <div class="legend-swatch" style="background:transparent; outline:2px solid #818cf8; outline-offset:1px;"></div>
        Today
      </div>
      <div class="legend-item" style="color:#444; font-size:10px; margin-top:2px">
        Click: inspect · Double-click: toggle
      </div>
    </div>
  </div>
  <!-- Projection bar (hidden until a day is clicked) -->
  <div class="proj-bar" id="proj-bar" style="display:none">
    <div class="proj-inner">
      <div class="proj-label">As of</div>
      <div class="proj-date" id="proj-date">—</div>
      <div class="proj-count-group">
        <div class="proj-count safe" id="proj-count">—</div>
        <div class="proj-denom">/ 90 days</div>
      </div>
      <div class="proj-badge badge-safe" id="proj-badge">— remaining</div>
      <div class="proj-window-text" id="proj-window">Window: —</div>
      <div class="proj-hint">180-day count ending on selected date</div>
      <button class="proj-close" id="proj-close" title="Close">×</button>
    </div>
  </div>
</div>

<div class="calendar-wrapper" id="cal-root"></div>
<div class="tooltip" id="tooltip"></div>

<script>
// ═══════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════

function dr(s, e) { // dateRange → array of YYYY-MM-DD strings
  const out = [];
  const d = new Date(s + 'T12:00:00Z');
  const end = new Date(e + 'T12:00:00Z');
  for (; d <= end; d.setUTCDate(d.getUTCDate() + 1))
    out.push(d.toISOString().slice(0,10));
  return out;
}

const DEFAULT_SCHENGEN = new Set([
  // ── 2022 ──────────────────────────────────────────
  ...dr('2022-12-28','2022-12-31'),          // Dec: 4d

  // ── 2023 ──────────────────────────────────────────
  ...dr('2023-01-01','2023-01-23'),          // Jan: 23d Iceland
  ...dr('2023-02-01','2023-02-17'),          // Feb: 17d
  ...dr('2023-03-16','2023-03-31'),          // Mar: 16d
  '2023-04-01','2023-04-02',                 // Apr: 17d (1-2, 16-30)
  ...dr('2023-04-16','2023-04-30'),
  ...dr('2023-05-28','2023-05-31'),          // May: 4d
  ...dr('2023-06-01','2023-06-06'),          // Jun: 6d
  ...dr('2023-07-01','2023-07-28'),          // Jul: 28d France/Iceland
  ...dr('2023-08-01','2023-08-17'),          // Aug: 24d (1-17, 20-26)
  ...dr('2023-08-20','2023-08-26'),
  ...dr('2023-09-15','2023-09-30'),          // Sep: 16d Berlin/Iceland
  ...dr('2023-10-01','2023-10-28'),          // Oct: 28d Iceland
  // Nov: 0
  ...dr('2023-12-10','2023-12-15'),          // Dec: 9d (10-15, 29-31)
  ...dr('2023-12-29','2023-12-31'),

  // ── 2024 ──────────────────────────────────────────
  ...dr('2024-01-01','2024-01-14'),          // Jan: 25d (1-14, 21-31)
  ...dr('2024-01-21','2024-01-31'),
  ...dr('2024-02-01','2024-02-10'),          // Feb: 10d
  // Mar, Apr: 0
  ...dr('2024-05-27','2024-05-31'),          // May: 5d
  ...dr('2024-06-28','2024-06-30'),          // Jun: 3d Iceland/Greenland
  ...dr('2024-07-01','2024-07-31'),          // Jul: 31d Iceland/Greenland/Brussels/Germany
  ...dr('2024-08-01','2024-08-03'),          // Aug: 3d
  ...dr('2024-09-02','2024-09-14'),          // Sep: 21d (2-14, 23-30)
  ...dr('2024-09-23','2024-09-30'),
  ...dr('2024-10-01','2024-10-06'),          // Oct: 6d Oslo
  // Nov, Dec: 0

  // ── 2025 ──────────────────────────────────────────
  ...dr('2025-01-05','2025-01-31'),          // Jan: 27d Iceland
  ...dr('2025-02-01','2025-02-23'),          // Feb: 23d Iceland
  // Mar, Apr: 0
  ...dr('2025-05-02','2025-05-09'),          // May: 8d
  ...dr('2025-06-10','2025-06-30'),          // Jun: 21d Iceland
  ...dr('2025-07-01','2025-07-31'),          // Jul: 31d Iceland
  ...dr('2025-08-01','2025-08-25'),          // Aug: 25d Iceland
  ...dr('2025-09-01','2025-09-26'),          // Sep: 26d Germany/Oslo
  ...dr('2025-10-01','2025-10-04'),          // Oct: 4d Oslo
  // Nov: 0
  ...dr('2025-12-11','2025-12-20'),          // Dec: 10d Iceland

  // ── 2026 ──────────────────────────────────────────
  ...dr('2026-01-22','2026-01-31'),          // Jan: 10d Iceland
  ...dr('2026-02-01','2026-02-15'),          // Feb: 15d Iceland
  // Mar: 0
  ...dr('2026-04-23','2026-04-30'),          // Apr: 8d Iceland
  ...dr('2026-05-01','2026-05-22'),          // May: 22d Iceland
  ...dr('2026-06-23','2026-06-30'),          // Jun: 8d Italy/Iceland
  ...dr('2026-07-01','2026-07-05'),          // Jul: 22d Iceland/Chamonix (1-5, 11-27)
  ...dr('2026-07-11','2026-07-27'),
  ...dr('2026-08-11','2026-08-17'),          // Aug: 7d Iceland
]);

// ── User overrides (persisted) ──
let overrides = {};
try { overrides = JSON.parse(localStorage.getItem('schengen_overrides') || '{}'); } catch(e) {}

const schengen = new Set(DEFAULT_SCHENGEN);
for (const [d, v] of Object.entries(overrides)) {
  v ? schengen.add(d) : schengen.delete(d);
}

function toggle(dateStr) {
  const was = schengen.has(dateStr);
  was ? schengen.delete(dateStr) : schengen.add(dateStr);
  overrides[dateStr] = !was;
  try { localStorage.setItem('schengen_overrides', JSON.stringify(overrides)); } catch(e) {}
}

// ═══════════════════════════════════════════════════
// DATE HELPERS
// ═══════════════════════════════════════════════════

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
}

function windowStart() {
  return addDays(todayStr(), -179); // 180 days incl today
}

function countInWindow() {
  const today = todayStr();
  const ws = windowStart();
  let n = 0;
  const d = new Date(ws + 'T12:00:00Z');
  const end = new Date(today + 'T12:00:00Z');
  for (; d <= end; d.setUTCDate(d.getUTCDate()+1))
    if (schengen.has(d.toISOString().slice(0,10))) n++;
  return n;
}

function countAsOf(dateStr) {
  // Count Schengen days in the 180-day window ending on dateStr
  const ws = addDays(dateStr, -179);
  let n = 0;
  const d = new Date(ws + 'T12:00:00Z');
  const end = new Date(dateStr + 'T12:00:00Z');
  for (; d <= end; d.setUTCDate(d.getUTCDate()+1))
    if (schengen.has(d.toISOString().slice(0,10))) n++;
  return { count: n, ws };
}

function fmtDate(s) {
  const [y,m,d] = s.split('-');
  return new Date(s+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════

const DOW = ['S','M','T','W','T','F','S'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function daysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
function firstDOW(y, m)    { return new Date(y, m, 1).getDay(); }

function buildCalendar() {
  const root = document.getElementById('cal-root');
  const today = todayStr();
  const ws = windowStart();

  const YEAR_RANGES = [
    [2022, 11, 11],  // year, startMonth, endMonth
    [2023, 0, 11],
    [2024, 0, 11],
    [2025, 0, 11],
    [2026, 0, 11],
  ];

  for (const [year, mStart, mEnd] of YEAR_RANGES) {
    const section = document.createElement('div');
    section.className = 'year-section';
    section.innerHTML = `<div class="year-label">${year}</div>`;

    const row = document.createElement('div');
    row.className = 'months-row';

    for (let m = mStart; m <= mEnd; m++) {
      row.appendChild(buildMonth(year, m, today, ws));
    }

    section.appendChild(row);
    root.appendChild(section);
  }
}

function buildMonth(year, month, today, ws) {
  const card = document.createElement('div');
  card.className = 'month-card';
  card.dataset.ym = `${year}-${month}`;

  // Header
  const title = document.createElement('div');
  title.className = 'month-title';
  title.textContent = `${MONTHS[month]} ${year}`;
  card.appendChild(title);

  // DOW labels
  const dowRow = document.createElement('div');
  dowRow.className = 'dow-row';
  DOW.forEach(l => {
    const c = document.createElement('div');
    c.className = 'dow-cell';
    c.textContent = l;
    dowRow.appendChild(c);
  });
  card.appendChild(dowRow);

  // Days grid
  const grid = document.createElement('div');
  grid.className = 'days-grid';

  const dim = daysInMonth(year, month);
  const fd = firstDOW(year, month);

  // empty cells
  for (let i = 0; i < fd; i++) {
    const empty = document.createElement('div');
    empty.className = 'day empty';
    grid.appendChild(empty);
  }

  for (let d = 1; d <= dim; d++) {
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cell = document.createElement('div');
    cell.className = 'day';
    cell.dataset.date = ds;
    cell.textContent = d;
    applyCellClass(cell, ds, today, ws);

    cell.addEventListener('click', () => {
      showProjection(ds);
    });

    cell.addEventListener('dblclick', () => {
      toggle(ds);
      applyCellClass(cell, ds, today, ws);
      updateMonthCount(cell.closest('.month-card'));
      updateHeader();
      // Refresh projection if this day is currently selected
      if (selectedDate === ds) showProjection(ds);
    });

    cell.addEventListener('mouseenter', e => showTip(e, ds));
    cell.addEventListener('mousemove',  e => moveTip(e));
    cell.addEventListener('mouseleave', hideTip);

    grid.appendChild(cell);
  }
  card.appendChild(grid);

  // Footer with monthly count
  const footer = document.createElement('div');
  footer.className = 'month-footer';
  const mc = document.createElement('div');
  mc.className = 'month-count';
  footer.appendChild(mc);
  card.appendChild(footer);
  updateMonthCount(card);

  return card;
}

function applyCellClass(cell, ds, today, ws) {
  const isFuture = ds > today;
  const inW = ds >= ws && ds <= today;
  const inS = schengen.has(ds);

  let cls = 'day';
  if (isFuture) cls += inS ? ' future-schengen' : ' future-outside';
  else if (inS) cls += ' schengen';
  else cls += ' outside' + (inW ? ' in-window' : '');
  if (ds === today) cls += ' today';

  cell.className = cls;
}

function updateMonthCount(card) {
  const cells = card.querySelectorAll('.day[data-date]');
  let n = 0;
  cells.forEach(c => { if (schengen.has(c.dataset.date)) n++; });
  const mc = card.querySelector('.month-count');
  mc.textContent = n > 0 ? `${n}d in Schengen` : '';
}

// ═══════════════════════════════════════════════════
// HEADER
// ═══════════════════════════════════════════════════

function updateHeader() {
  const used = countInWindow();
  const rem = 90 - used;
  const pct = Math.min(100, (used/90)*100);
  const level = used >= 90 ? 'danger' : used >= 72 ? 'warn' : 'safe';

  document.getElementById('count-num').textContent = used;
  document.getElementById('count-num').className = `count-num ${level}`;

  document.getElementById('badge').textContent = rem >= 0 ? `${rem} remaining` : `${Math.abs(rem)} over limit!`;
  document.getElementById('badge').className = `badge badge-${level}`;

  document.getElementById('progress').style.width = pct + '%';
  document.getElementById('progress').className = `progress-fill bg-${level}`;

  document.getElementById('progress-text').textContent = `${used} / 90 days`;

  const today = todayStr();
  const ws = windowStart();
  document.getElementById('window-dates').textContent = `${fmtDate(ws)} → ${fmtDate(today)}`;
}

// ═══════════════════════════════════════════════════
// PROJECTION
// ═══════════════════════════════════════════════════

let selectedDate = null;

function showProjection(ds) {
  // Deselect previous
  if (selectedDate) {
    const prev = document.querySelector(`.day[data-date="${selectedDate}"]`);
    if (prev) prev.classList.remove('selected');
  }

  selectedDate = ds;
  const cell = document.querySelector(`.day[data-date="${ds}"]`);
  if (cell) cell.classList.add('selected');

  const { count, ws } = countAsOf(ds);
  const rem = 90 - count;
  const level = count >= 90 ? 'danger' : count >= 72 ? 'warn' : 'safe';
  const today = todayStr();
  const isFuture = ds > today;

  document.getElementById('proj-bar').style.display = '';
  document.getElementById('proj-date').textContent = fmtDate(ds) + (isFuture ? ' (future)' : '');
  document.getElementById('proj-count').textContent = count;
  document.getElementById('proj-count').className = `proj-count ${level}`;
  document.getElementById('proj-badge').textContent = rem >= 0 ? `${rem} remaining` : `${Math.abs(rem)} over limit`;
  document.getElementById('proj-badge').className = `proj-badge badge-${level}`;
  document.getElementById('proj-window').textContent = `Window: ${fmtDate(ws)} → ${fmtDate(ds)}`;
}

function clearProjection() {
  if (selectedDate) {
    const prev = document.querySelector(`.day[data-date="${selectedDate}"]`);
    if (prev) prev.classList.remove('selected');
    selectedDate = null;
  }
  document.getElementById('proj-bar').style.display = 'none';
}

// ═══════════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════════

const tip = document.getElementById('tooltip');

function showTip(e, ds) {
  const inS = schengen.has(ds);
  const today = todayStr();
  const isFuture = ds > today;
  const status = inS ? '🟢' : '⚪';
  const { count } = countAsOf(ds);
  const rem = 90 - count;
  const remTxt = rem >= 0 ? `${rem} left` : `${Math.abs(rem)} over`;
  const futureNote = isFuture ? ' · planned' : '';
  tip.textContent = `${fmtDate(ds)} · ${status}${futureNote} · ${count}/90 days as of here (${remTxt})`;
  tip.style.opacity = '1';
  moveTip(e);
}

function moveTip(e) {
  tip.style.left = (e.clientX + 12) + 'px';
  tip.style.top  = (e.clientY - 28) + 'px';
}

function hideTip() {
  tip.style.opacity = '0';
}

// ═══════════════════════════════════════════════════

// ═══════════════════════════════════════════════════

buildCalendar();
updateHeader();

// Wire up projection close button
document.getElementById('proj-close').addEventListener('click', clearProjection);

// Scroll to current year
(function() {
  const today = todayStr();
  const year = today.slice(0,4);
  const sections = document.querySelectorAll('.year-section');
  sections.forEach(s => {
    if (s.querySelector('.year-label') && s.querySelector('.year-label').textContent === year) {
      setTimeout(() => s.scrollIntoView({behavior:'smooth', block:'start'}), 300);
    }
  });
})();

// Midnight refresh
function scheduleMidnight() {
  const now = new Date();
  const midnight = new Date(now); midnight.setHours(24,0,1,0);
  setTimeout(() => { location.reload(); }, midnight - now);
}
scheduleMidnight();
